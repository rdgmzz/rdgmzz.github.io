<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integrantes del equipo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    /* Cuadrícula: quita la forma de lista y alinea las tarjetas */
    .equipo {
      list-style: none;
      margin: 0 auto;
      padding: 0;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .integrante {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Todas las fotos del mismo tamaño */
    .integrante img {
      width: 100%;
      height: 260px;
      object-fit: cover;      /* recorta sin deformar */
      object-position: center top;
      border-radius: 8px;
    }

    .integrante h2 {
      font-size: 1.1rem;
      margin: 14px 0 10px;
      flex-grow: 1;           /* alinea los enlaces abajo */
    }

    .integrante a {
      display: inline-block;
      padding: 8px 16px;
      background: #2a6edb;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .integrante a:hover {
      background: #1c4fa3;
    }
  </style>
</head>
<body>
